server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: sistema-evaluaciones
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:evaluaciones}
    username: ${POSTGRES_USER:evaluaciones}
    password: ${POSTGRES_PASSWORD:dev_only_change_me}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
    out-of-order: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
