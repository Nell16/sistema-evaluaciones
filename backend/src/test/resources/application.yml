
spring:
  application:
    name: sistema-evaluaciones-test

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${POSTGRES_PORT:5432}/evaluaciones_bfa_test
    username: ${POSTGRES_USER:evaluaciones}
    password: ${POSTGRES_PASSWORD:dev_only_change_me}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration
    out-of-order: true
